plugins { id 'com.android.application' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
android {
    namespace 'io.github.oddfoxerr.cyn'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.oddfoxerr.cyn'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (System.getenv('CYN_KEYSTORE')) {
                storeFile file(System.getenv('CYN_KEYSTORE'))
                storePassword System.getenv('CYN_KEY_PASSWORD')
                keyAlias 'cyn-android'
                keyPassword System.getenv('CYN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CYN_KEYSTORE')) signingConfig signingConfigs.localRelease
        }
    }
    lint { abortOnError true }
}
