plugins { id 'com.android.application' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
android {
    namespace 'io.github.oddfoxerr.cyn'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.oddfoxerr.cyn.studio'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 26
        versionName '0.2.22-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (System.getenv('CYN_KEYSTORE')) {
                storeFile file(System.getenv('CYN_KEYSTORE'))
                storePassword System.getenv('CYN_KEY_PASSWORD')
                keyAlias 'cyn-studio'
                keyPassword System.getenv('CYN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CYN_KEYSTORE')) signingConfig signingConfigs.localRelease
        }
    }
    lint { abortOnError true }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    androidResources { noCompress 'onnx' }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
