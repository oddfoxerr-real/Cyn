name: Cyn One-Hour Base AI Training and Release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cyn-base-hour.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cyn-base-hour-training
  cancel-in-progress: false
jobs:
  train:
    name: Real one-hour gradient optimization
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Smoke-test trainer
        run: python -u training/train_hour_v2.py --duration 4 --output training-smoke
      - name: Optimize base AI for 3600 actual training seconds
        run: python -u training/train_hour_v2.py --duration 3600 --output training-output
      - name: Verify training record
        run: |
          python -c "import json,math; r=json.load(open('training-output/starter-evaluation.json')); m=json.load(open('training-output/cyn-starter.json')); assert r['training']['actual_gradient_seconds']>=3600 and r['training']['optimizer_steps']>1000; assert len(m['weights'])==209 and all(math.isfinite(v) for v in m['weights'])"
      - uses: actions/upload-artifact@v4
        with:
          name: hour-trained-base
          path: training-output/
          if-no-files-found: error
  release:
    name: Build and publish Cyn v2.0.14
    needs: train
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hour-trained-base
          path: training-output
      - name: Stage model and bump release version
        run: python scripts/finalize_hour_release.py
      - name: Validate UI and updater
        shell: pwsh
        run: |
          node scripts/test_ai_hub.mjs
          ./scripts/test_cyn_updater_ui.ps1
      - name: Compile Windows app
        shell: pwsh
        run: ./BUILD_CYN.ps1
      - name: Build Windows installer
        shell: pwsh
        run: ./BUILD_INSTALLER.ps1
      - name: Verify package integrity and bundled AI
        shell: pwsh
        run: |
          $exe='dist/Cyn-Setup-2.0.14-x64.exe'
          if (!(Test-Path $exe) -or !(Test-Path "$exe.sha256") -or !(Test-Path 'dist/Cyn/cyn-starter.json') -or !(Test-Path 'dist/Cyn-Windows-x64.zip')) { throw 'Missing release output' }
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash
          $expected=((Get-Content "$exe.sha256" -Raw).Trim() -split '\s+')[0]
          if ($actual -ine $expected) { throw 'SHA-256 mismatch' }
      - name: Commit built model
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models README_CYN.md RELEASE_NOTES_2.0.14.md BUILD_INSTALLER.ps1 Installer/Cyn/Cyn.iss fxsound scripts/test_ai_hub.mjs
          git commit -m "feat(cyn): hour-trained base AI (v2.0.14)"
          git push origin HEAD:main
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha=(git rev-parse HEAD).Trim()
          gh release create v2.0.14 --target $sha --title "Cyn 2.0.14 - Hour-trained base AI" --notes-file RELEASE_NOTES_2.0.14.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload v2.0.14 dist/Cyn-Setup-2.0.14-x64.exe dist/Cyn-Setup-2.0.14-x64.exe.sha256 dist/Cyn-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit v2.0.14 --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
