name: CYN Windows AUDONIC / BrainScan regression

on:
  push:
    branches:
      - feature/windows-audonic-brainscan-material3-20261022
  pull_request:
    paths:
      - 'fxsound/Source/GUI/CynAudonicStudio.h'
      - 'fxsound/Source/GUI/CynBrainScan3D.h'
      - 'fxsound/Source/GUI/FxController.*'
      - 'fxsound/Source/GUI/FxProView.*'
      - 'fxsound/Source/GUI/FxTheme.*'
      - 'fxsound/Source/GUI/CynThemeStudio.h'
      - 'fxsound/Source/GUI/CynThemeAtmosphere.h'
      - 'fxsound/Source/GUI/CynAiHubDialog.h'
      - 'tests/native/audonic_studio_policy_test.cpp'
      - 'scripts/test_windows_audonic_brainscan.mjs'
      - '.github/workflows/windows-audonic-regression.yml'

permissions:
  contents: read

jobs:
  creative-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native AUDONIC and BrainScan source integration
        run: node scripts/test_windows_audonic_brainscan.mjs
      - name: Compile and execute native creative DSP policy regression
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/native/audonic_studio_policy_test.cpp -o /tmp/cyn-audonic-regression
          /tmp/cyn-audonic-regression
