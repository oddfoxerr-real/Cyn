name: CYN Audio Desktop Preview

on:
  push:
    branches:
      - feature/riff-native-cyn-shell-20261024
    paths:
      - "riff-cyn/**"
      - "fxsound/Source/GUI/FxController.cpp"
      - ".github/workflows/cyn-riff-native-shell.yml"
  pull_request:
    paths:
      - "riff-cyn/**"
      - "fxsound/Source/GUI/FxController.cpp"
      - ".github/workflows/cyn-riff-native-shell.yml"

permissions:
  contents: write

# Fail old branch builds automatically when a newer Riff UI change lands.
concurrency:
  group: cyn-riff-preview-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-riff-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original Riff at pinned commit
        uses: actions/checkout@v4
        with:
          repository: rootscripts/riff
          ref: 398c3dac976bd7b4a7a4b4d7a6d7636ea868a0a8
          path: riff-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import Riff styles and copyright
        run: node riff-cyn/scripts/vendor-riff.mjs
      - name: Validate renderer, native commands and Riff legal assets
        run: |
          node --check riff-cyn/main.cjs
          node --check riff-cyn/native-bridge.cjs
          node --check riff-cyn/commands.cjs
          node --check riff-cyn/renderer/renderer.js
          node --check riff-cyn/renderer/rail-drawer.js
          node --check riff-cyn/scripts/vendor-riff.mjs
          node --test riff-cyn/tests/*.test.cjs
          test -s riff-cyn/renderer/vendor/riff.css
          test -s riff-cyn/renderer/vendor/Riff-LICENSE.txt
          grep -q 'MIT License' riff-cyn/renderer/vendor/Riff-LICENSE.txt

  build-windows-riff:
    needs: verify-riff-shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout same original Riff revision
        uses: actions/checkout@v4
        with:
          repository: rootscripts/riff
          ref: 398c3dac976bd7b4a7a4b4d7a6d7636ea868a0a8
          path: riff-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Electron and NSIS packaging tools
        shell: pwsh
        working-directory: riff-cyn
        run: npm install --no-audit --no-fund
      - name: Stage original Riff styling for visual verification
        shell: pwsh
        working-directory: riff-cyn
        run: npm run vendor:riff
      - name: Render five actual Riff/Electron UI screenshots
        shell: pwsh
        working-directory: riff-cyn
        env:
          CYN_RIFF_CAPTURE_DIR: artifacts/screenshots
        run: npm start
      - uses: actions/upload-artifact@v4
        with:
          name: CYN-Audio-Visual-Screenshots
          path: riff-cyn/artifacts/screenshots/*
          if-no-files-found: error
          retention-days: 14
      - name: Build CYN Windows NSIS installer after visual QA passes
        shell: pwsh
        working-directory: riff-cyn
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: CYN-Audio-Desktop-Preview
          path: riff-cyn/dist/CYN-Audio-Preview-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish standalone CYN Audio desktop preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/riff-native-cyn-shell-20261024'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'cyn-audio-desktop-v0.2.0-preview'
          $exe = Get-Item 'riff-cyn/dist/CYN-Audio-Preview-0.2.0-x64.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $checksum = "riff-cyn/dist/$($exe.Name).sha256"
          Set-Content -LiteralPath $checksum -Value "$hash  $($exe.Name)" -Encoding ascii
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Preview tag already exists: $tag; no asset overwrite permitted." }
          gh release create $tag $exe.FullName $checksum --target $env:GITHUB_SHA --title "CYN Audio Desktop 0.2.0 preview" --notes "Separate standalone Riff-based CYN Audio desktop preview with graphite Material 3 Settings and custom close animation. Uses an installed native Cyn.exe audio engine. Riff MIT and FxSound AGPL notices are bundled; this preview is not the stable CYN updater channel." --prerelease --latest=false

