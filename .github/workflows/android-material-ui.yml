name: Android Material UI validation
on:
  push:
    branches: ['feature/android-material3-expressive-20261022']
    paths: ['android/**', '.github/workflows/android-material-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Assemble Android debug app and run lint
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-ui-lint
          path: android/app/build/reports/lint-results-debug.*
