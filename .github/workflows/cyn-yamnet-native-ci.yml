name: Cyn Native YAMNet Compiler Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cyn-yamnet-native-ci.yml
      - fxsound/Source/GUI/CynYamNetWorker.h
      - fxsound/Source/GUI/FxController.h
      - fxsound/Source/GUI/FxController.cpp
      - dsp/include/SourceAudioAnalyzer.h
      - dsp/include/DfxDsp.h
      - dsp/DfxDsp.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check native source contracts
        shell: pwsh
        run: node scripts/test_yamnet_native.mjs
      - name: Compile native x64 Cyn with YAMNet worker
        shell: pwsh
        run: .\BUILD_CYN.ps1
      - name: Verify built Windows application exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/Cyn/Cyn.exe)) { throw 'Native executable missing' }
