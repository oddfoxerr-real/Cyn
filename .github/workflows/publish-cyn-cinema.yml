name: Publish Cyn Cinema AI to Hub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-cyn-cinema.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyn-cinema-hub-publication
  cancel-in-progress: false

jobs:
  train-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Train cinema profile against independent synthetic sets
        run: python -u training/train_movie_profile.py
      - name: Check model, catalogue and import schema
        run: node scripts/test_ai_hub.mjs
      - name: Confirm Cinema AI is safe for existing Hub import
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('ai-hub/community/cyn-cinema.cynai.json').read_text())
          c=json.loads(Path('ai-hub/community/index.json').read_text())
          assert p['format']=='cyn-ai-profile'
          assert p['model']['architecture']=='cyn-audio-11x12x5'
          assert len(p['model']['weights'])==209
          assert p['model']['ready']==[True,False,False,False,True]
          assert any(x['file']=='cyn-cinema.cynai.json' for x in c['profiles'])
          assert Path('ai-hub/community/cyn-cinema-evaluation.json').is_file()
          PY
      - name: Publish trained profile and catalogue to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-hub/community/index.json \
            ai-hub/community/cyn-cinema.cynai.json \
            ai-hub/community/cyn-cinema-evaluation.json
          git diff --cached --quiet && { echo "No generated Cinema profile to publish"; exit 1; }
          git commit -m "feat(cyn): publish tested Cinema AI in native AI Hub catalogue"
          git push origin HEAD:main
