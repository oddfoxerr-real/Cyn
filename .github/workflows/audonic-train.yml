name: Train and Publish AUDONIC Neural Mischief Student

on:
  push:
    branches: [feature/audonic-3b-mischief-lab]
    paths:
      - 'audonic/**'
      - 'android/tests/native/audonic_mischief_test.cpp'
      - 'android/app/src/main/cpp/AudonicMischief.h'
      - '.github/workflows/audonic-train.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audonic-student-v0p1
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training stack
        shell: bash
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 scipy==1.14.1 soundfile==0.12.1
      - name: Verify public-dataset license gate and student model shapes
        shell: bash
        run: python audonic/test_audonic.py
      - name: Verify safety of native DSP
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror android/tests/native/audonic_mischief_test.cpp -o /tmp/audonic-dsp
          /tmp/audonic-dsp
      - name: Download actual APEX10M trained teacher with recorded checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p teacher
          base=https://github.com/oddfoxerr-real/Cyn/releases/download/apex10m-experimental-rc-v1
          curl -fsSL --retry 3 "$base/CYN-APEX10M-RC1-manifest.json" -o teacher/manifest.json
          curl -fsSL --retry 3 "$base/CYN-APEX10M-RC1-Spatial-Head.onnx" -o teacher/apex10m.onnx
          python - <<'PY'
          import json,hashlib,pathlib
          manifest=json.load(open('teacher/manifest.json'))
          data=pathlib.Path('teacher/apex10m.onnx').read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['onnx_sha256']
          assert manifest['trained_spatial_head_parameters']==3693992
          assert manifest['frozen_percent_of_15h']>=95
          print('PASS verified actual APEX10M teacher',manifest['frozen_percent_of_15h'],'%')
          PY
      - name: Train real AUDONIC creative FX neural student with APEX knowledge
        shell: bash
        run: |
          set -euo pipefail
          python audonic/train.py --steps 600 --teacher teacher/apex10m.onnx --output dist/audonic
      - name: Release acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,hashlib
          model=pathlib.Path('dist/audonic/audonic-student.onnx')
          info=json.loads(pathlib.Path('dist/audonic/audonic-manifest.json').read_text())
          assert model.stat().st_size > 10000
          assert info['gradient_updates']==600
          assert info['apex10m_teacher_distillation']
          assert info['synthetic_policy_training']
          assert info['validation_mse']<0.09
          assert info['onnx_max_abs_parity_error']<0.0005
          assert not info['three_b_teacher_trained'] and not info['real_music_quality_verified']
          assert hashlib.sha256(model.read_bytes()).hexdigest()==info['onnx_sha256']
          print('PASS genuine trained neural model and validated ONNX weights',info)
          PY
          (cd dist/audonic && sha256sum audonic-student.onnx audonic-student.pt audonic-manifest.json > checksums.sha256)
      - name: Preserve full checkpoint, model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: AUDONIC-Neural-Mischief-Student-Experimental
          path: dist/audonic/
          retention-days: 90
      - name: Publish independent AUDONIC model release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=audonic-neural-student-v0.1.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::AUDONIC model release already exists; refusing to replace weights"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "AUDONIC Creative Neural AI v0.1 — Experimental Trained Student" \
            --notes-file audonic/README.md \
            dist/audonic/audonic-student.onnx \
            dist/audonic/audonic-student.pt \
            dist/audonic/audonic-manifest.json \
            dist/audonic/checksums.sha256
