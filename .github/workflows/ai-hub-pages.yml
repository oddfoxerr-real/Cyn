name: Cyn AI Hub Pages
on:
  push:
    branches: [main]
    paths:
      - "ai-hub/**"
      - ".github/workflows/ai-hub-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cyn-ai-hub-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ai-hub/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate AI Hub JavaScript and shared profile
        run: |
          node --check ai-hub/app.js
          node scripts/test_ai_hub.mjs
      - name: Stage AI Hub as independent website path
        run: |
          mkdir -p public/ai-hub
          cp -R ai-hub/. public/ai-hub/
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./ai-hub/"><title>Cyn AI Hub</title><a href="./ai-hub/">Open Cyn AI Hub</a>' > public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
