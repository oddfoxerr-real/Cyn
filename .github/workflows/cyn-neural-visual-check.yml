name: Cyn Neural Animation Validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cyn-neural-visual-check.yml
      - fxsound/Source/GUI/CynThemeAtmosphere.h
  pull_request:
    paths:
      - .github/workflows/cyn-neural-visual-check.yml
      - fxsound/Source/GUI/CynThemeAtmosphere.h
      - fxsound/Source/GUI/CynThemeStudio.h
      - fxsound/Source/GUI/CynNeuralActivity.h
      - fxsound/Source/GUI/FxProView.h
      - fxsound/Source/GUI/FxProView.cpp
      - fxsound/Source/GUI/FxMainWindow.h
      - fxsound/Source/GUI/FxMainWindow.cpp
      - fxsound/Source/GUI/FxController.h
      - fxsound/Source/GUI/FxController.cpp
      - scripts/test_ai_hub.mjs
      - fxsound/Source/GUI/CynAudioRepair.h
      - fxsound/Source/GUI/FxSettingsDialog.h
      - fxsound/Source/GUI/FxSettingsDialog.cpp
      - CynAudioRepair.ps1
      - BUILD_CYN.ps1
      - scripts/test_audio_repair.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate neural animation and AI Hub regression checks
        shell: pwsh
        run: node scripts/test_ai_hub.mjs
      - name: Validate opt-in audio repair and PowerShell worker
        shell: pwsh
        run: |
          node scripts/test_audio_repair.mjs
          if ($LASTEXITCODE -ne 0) { throw "Audio Repair consent contract failed." }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'CynAudioRepair.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Cyn Audio Repair PowerShell syntax errors."
          }
      - name: Compile native Cyn x64 with neural animation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./BUILD_CYN.ps1
      - name: Confirm runnable binary was built
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Cyn/Cyn.exe')) { throw 'Native Cyn application missing' }
          if (!(Test-Path 'dist/Cyn-Windows-x64.zip')) { throw 'Portable archive missing' }

      - name: Upload Theme Studio Windows preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cyn-theme-studio-preview
          path: dist/Cyn-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error
