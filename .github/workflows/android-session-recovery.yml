name: CYN Android session-routing recovery validation

on:
  push:
    branches:
      - fix/android-session-package-recovery-20261025
  pull_request:
    branches:
      - feature/android-cyn-graphite-settings-no-capture-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and exercise session routing policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyn-routing"
          javac -d "$RUNNER_TEMP/cyn-routing" \
            android/app/src/main/java/io/github/oddfoxerr/cyn/SessionEffectPolicy.java \
            android/tests/SessionEffectPolicyTest.java
          java -cp "$RUNNER_TEMP/cyn-routing" io.github.oddfoxerr.cyn.SessionEffectPolicyTest

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android build toolchain
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare verified CYN model assets
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 onnxruntime==1.23.2
          python android/scripts/prepare_models.py
      - name: Compile Android debug APK and run lint
        run: |
          set -euo pipefail
          bash android/gradlew -p android :app:assembleDebug :app:lintDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned-for-distribution debug test build
        uses: actions/upload-artifact@v4
        with:
          name: CYN-session-routing-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
