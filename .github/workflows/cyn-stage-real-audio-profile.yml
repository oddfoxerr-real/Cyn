name: Stage Verified Real-Audio AI Profile

on:
  push:
    branches: [release/real-audio-v2.0.37]
    paths:
      - .github/workflows/cyn-stage-real-audio-profile.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exact successful trained checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release download cyn-real-audio-lab-13h-20261016 --dir incoming --pattern 'cyn-real-audio-experimental.cynai.json'
          gh release download cyn-real-audio-lab-13h-20261016 --dir incoming --pattern 'real-audio-training-report.json'
          echo '9440a30bd37280c45245a340afe46f1f0531d234c5148ea4ee2f537faa448fab  incoming/cyn-real-audio-experimental.cynai.json' | sha256sum -c -
          echo '9b8823486980141340bd59fe9b04e8c2d6e20927bcdd4a9021ecc5a6edb8fdf7  incoming/real-audio-training-report.json' | sha256sum -c -
      - name: Verify model and materialize native Cyn AI Hub profile
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          source=Path('incoming/cyn-real-audio-experimental.cynai.json')
          profile=json.loads(source.read_text())
          report=json.loads(Path('incoming/real-audio-training-report.json').read_text())
          assert report['passed_real_recording_heuristic_gate'] is True
          assert report['training_seconds']>=46800
          assert report['actually_better_listening'] is None
          assert profile['format']=='cyn-ai-profile' and profile['schema']==1
          assert profile['model']['schema']==1
          assert profile['model']['architecture']=='cyn-audio-11x12x5'
          assert len(profile['model']['weights'])==209
          assert all(isinstance(w,(float,int)) and math.isfinite(w) and abs(w)<=100 for w in profile['model']['weights'])
          assert profile['model']['ready']==[True,False,False,False,True]
          profile['profile']['name']='Cyn Real Audio 13h (Experimental)'
          profile['profile']['description']=('Genuine 13-hour free CPU gradient training on 16 kHz real speech '
              'and instrument note features. Passed independent held-out HEURISTIC '
              'Bass/Clarity prediction tests. Not verified to improve listening quality. '
              'Opt in via AI Hub; personal models remain unchanged until import.')
          profile['profile']['category']='experimental'
          profile['profile']['author']='Cyn contributors'
          Path('ai-hub/community/cyn-real-audio-13h.cynai.json').write_text(json.dumps(profile,indent=2)+'\n')
          print('PASS: verified release model staged as native AI Hub profile')
          PY
      - name: Commit verified profile to this release branch
        run: |
          git config user.name "Cyn Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-hub/community/cyn-real-audio-13h.cynai.json
          git commit -m 'feat(ai): bundle verified 13-hour real-audio experimental profile'
          git push origin HEAD:release/real-audio-v2.0.37
