name: Cyn Installer Filename Regression
on:
  pull_request:
    paths:
      - "BUILD_INSTALLER.ps1"
      - "Installer/Cyn/Cyn.iss"
      - "scripts/test_version_controls.mjs"
      - ".github/workflows/cyn-installer-manifest-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  output-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_version_controls.mjs
      - name: Parse installer build script with PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'BUILD_INSTALLER.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'BUILD_INSTALLER.ps1 contains syntax errors.'
          }

