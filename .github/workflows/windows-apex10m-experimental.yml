name: CYN Windows Native APEX 10M Experimental Release

on:
  push:
    branches:
      - feature/windows-apex10m-spatial-native-experimental
    paths:
      - 'dsp/**'
      - 'fxsound/**'
      - 'tests/cyn_apex10m_spatial_test.cpp'
      - 'Installer/Cyn/Cyn.iss'
      - 'RELEASE_NOTES_2.0.75.md'
      - '.github/workflows/windows-apex10m-experimental.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyn-windows-native-apex10m-experimental
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run native spatial DSP phase safeguards
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 tests\cyn_apex10m_spatial_test.cpp /Fe:apex10m-spatial-test.exe
          if errorlevel 1 exit /b 1
          apex10m-spatial-test.exe
          if errorlevel 1 exit /b 1
      - name: Compile native Windows Cyn with APEX 10M DSP preview
        shell: pwsh
        run: |
          .\BUILD_CYN.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CYN native build failed' }
          if (!(Test-Path dist/Cyn/Cyn.exe)) { throw 'CYN executable not produced' }
      - name: Build real Windows installer
        shell: pwsh
        run: |
          .\BUILD_INSTALLER.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $exe='dist/Cyn-Setup-2.0.75-x64.exe'
          if (!(Test-Path $exe) -or !(Test-Path "$exe.sha256")) { throw 'Installer or checksum missing' }
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content "$exe.sha256" -Raw).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Incorrect installer hash' }
          if (!(Test-Path dist/Cyn-Windows-x64.zip)) { throw 'Portable Cyn missing' }
          Copy-Item dist/Cyn-Windows-x64.zip dist/Cyn-APEX10M-Spatial-Experimental-2.0.75-Portable.zip
      - name: Publish experimental assets to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYN-Windows-APEX10M-Spatial-Experimental
          path: |
            dist/Cyn-Setup-2.0.75-x64.exe
            dist/Cyn-Setup-2.0.75-x64.exe.sha256
            dist/Cyn-APEX10M-Spatial-Experimental-2.0.75-Portable.zip
          retention-days: 30
      - name: Publish experimental prerelease without marking stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='apex-10m-windows-native-experimental-v2.0.75'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Experimental tag already exists; refusing asset overwrite' }
          gh release create $tag 'dist/Cyn-Setup-2.0.75-x64.exe' 'dist/Cyn-Setup-2.0.75-x64.exe.sha256' 'dist/Cyn-APEX10M-Spatial-Experimental-2.0.75-Portable.zip' --target "${{ github.sha }}" --title 'CYN Windows 2.0.75 — APEX 10M Spatial Experimental' --notes-file RELEASE_NOTES_2.0.75.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub experimental release failed' }
