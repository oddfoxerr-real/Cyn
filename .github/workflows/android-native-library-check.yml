name: CYN Android Native Library Verification

on:
  push:
    branches:
      - fix/android-native-unified-library-20261028
  pull_request:
    branches:
      - release/android-one-search-v0.2.36-20261026

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned tools and verified AI models
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          python android/scripts/prepare_models.py
      - name: Confirm there is no source picker in the unified catalog
        run: |
          set -euo pipefail
          ! grep -Fq 'Show song sources' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'playableTrack()' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'linkOnlyResultsAreNotPresentedAsPlayableAudio' android/app/src/androidTest/java/io/github/oddfoxerr/cyn/UnifiedMusicSearchTest.java
      - name: Compile app, instrumentation tests and run lint
        run: bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Grant emulator accelerator access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash android/gradlew -p android :app:connectedDebugAndroidTest
      - name: Preserve validation reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYN-native-library-validation
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
