name: APEX 10M spatial reasoning architecture tests

on:
  pull_request:
    paths:
      - 'apex_engine/apex10m_*.py'
      - 'apex_engine/APEX10M_ARCHITECTURE.md'
      - 'tests/test_apex10m*.py'
      - '.github/workflows/cyn-apex10m-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'apex_engine/apex10m_*.py'
      - 'tests/test_apex10m.py'
      - '.github/workflows/cyn-apex10m-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.14.1 soundfile==0.12.1
      - name: Verify model size, gradients and stereo safety
        run: python -m unittest discover -s tests -p 'test_apex10m*.py' -v
