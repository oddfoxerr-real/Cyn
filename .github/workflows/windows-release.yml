name: Cyn Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cyn-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout full source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $script = Get-Content 'Installer/Cyn/Cyn.iss' -Raw
          if ($script -notmatch '(?m)^AppVersion=(\d+\.\d+\.\d+)\s*$') { throw 'Unable to read Cyn version from installer.' }
          $version = $Matches[1]
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) { throw 'Git tag and installer version differ.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "installer=Cyn-Setup-$version-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Check published release
        id: inspect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; 'User-Agent'='Cyn-Release-CI'; Accept='application/vnd.github+json'}
          try {
            $release = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            if ($release.draft) { 'state=draft' >> $env:GITHUB_OUTPUT }
            else { 'state=published' >> $env:GITHUB_OUTPUT }
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
              'state=missing' >> $env:GITHUB_OUTPUT
            } else { throw }
          }

      - name: Verify GitHub updater detects published releases
        if: steps.inspect.outputs.state != 'published'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\diagnose_cyn_updater.ps1

      - name: Validate stable Dark Theme and live neural visuals
        shell: pwsh
        run: node scripts/test_theme_neural.mjs
      - name: Validate installed version and update controls
        shell: pwsh
        run: |
          node scripts/test_version_controls.mjs
          node scripts/test_cyn_ui_polish.mjs
          node scripts/test_cyn_workspace_polish.mjs
          node scripts/test_cyn_v2069_material_and_timeline.mjs
          node scripts/test_cyn_liquid_screen_reveal.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native UI polish regression.' }
          node scripts/test_cyn_button_visuals.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Version controls regression.' }
          node scripts/test_cyn_vc_runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'x64 VC++ runtime installer regression.' }
      - name: Validate updater animation XAML
        if: steps.inspect.outputs.state != 'published'
        shell: powershell
        run: .\scripts\test_cyn_updater_ui.ps1

      - name: Validate AI Hub website and importable model
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: |
          node scripts/test_ai_hub.mjs

      - name: Validate optional AI DJ audio path
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: ./scripts/test_dj.ps1

      - name: Validate Auto Repair permissions and Windows Update worker
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: |
          node scripts/test_audio_repair.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Audio repair consent checks failed.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'CynAudioRepair.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'Audio repair worker syntax errors.' }

      - name: Verify AI-driven Sound Studio reads real applied DSP
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: |
          node scripts/test_ai_applied_ui.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Applied DSP visual safety contract failed.' }

      - name: Enable MSVC native regression runner
        if: steps.inspect.outputs.state != 'published'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Validate musical crescendo and headroom behavior
        if: steps.inspect.outputs.state != 'published'
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /I dsp\include /I fxsound\Source\GUI tests\cyn_crescendo_test.cpp /Fe:crescendo-test.exe
          if errorlevel 1 exit /b 1
          crescendo-test.exe
          if errorlevel 1 exit /b 1

      - name: Verify volume-neutral model inputs and kick across presets
        if: steps.inspect.outputs.state != 'published'
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /I dsp\include /I fxsound\Source\GUI tests\cyn_volume_kick_test.cpp /Fe:volume-kick-test.exe
          if errorlevel 1 exit /b 1
          volume-kick-test.exe
          if errorlevel 1 exit /b 1

      - name: Validate full-range Music AI sensitivity safety
        if: steps.inspect.outputs.state != 'published'
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /I fxsound\Source\GUI tests\cyn_sensitivity_range_test.cpp /Fe:cyn-sensitivity-test.exe
          if errorlevel 1 exit /b 1
          cyn-sensitivity-test.exe
          if errorlevel 1 exit /b 1

      - name: Validate Music AI Headroom Cap and expressive response
        if: steps.inspect.outputs.state != 'published'
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /I fxsound\Source\GUI tests\cyn_headroom_cap_test.cpp /Fe:cyn-headroom-cap-test.exe
          if errorlevel 1 exit /b 1
          cyn-headroom-cap-test.exe
          if errorlevel 1 exit /b 1

      - name: Validate adaptive preset cycling policy and stability
        if: steps.inspect.outputs.state != 'published'
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /I dsp\include /I fxsound\Source\GUI tests\cyn_preset_cycler_test.cpp /Fe:cyn-preset-cycler-test.exe
          if errorlevel 1 exit /b 1
          cyn-preset-cycler-test.exe
          if errorlevel 1 exit /b 1

      - name: Compile Cyn native x64
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\BUILD_CYN.ps1

      - name: Verify real APEX 6M ONNX inference and native activation
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: |
          node scripts/test_apex6m_activation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'APEX 6M native activation tests failed.' }
          & cl.exe /nologo /EHsc /O2 /std:c++17 tests/cyn_apex6m_onnx_smoke.cpp /Fe:apex-onnx-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Failed compiling native APEX ONNX smoke test.' }
          & .\apex-onnx-smoke.exe (Resolve-Path 'dist/Cyn')
          if ($LASTEXITCODE -ne 0) { throw 'Full APEX ONNX failed with Cyn bundled runtime.' }

      - name: Build Windows installer
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        run: .\BUILD_INSTALLER.ps1

      - name: Verify installer and SHA-256
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        env:
          CYN_INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          $exe = Join-Path dist $env:CYN_INSTALLER
          $checksum = "$exe.sha256"
          if (!(Test-Path $exe) -or !(Test-Path $checksum)) { throw 'Required installer or SHA-256 asset missing.' }
          $expected = ((Get-Content -Raw -LiteralPath $checksum).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'Installer failed SHA-256 verification.' }
          if (!(Test-Path 'dist/Cyn-Windows-x64.zip')) { throw 'Portable build missing.' }
          if ('${{ steps.version.outputs.version }}' -eq '2.0.18') {
            foreach($name in @('onnxruntime.dll','yamnet-16k-0p975s.onnx','yamnet-manifest.json')) {
              if (!(Test-Path (Join-Path 'dist/Cyn' $name))) { throw "YAMNet v2.0.18 is missing $name" }
            }
          }

      - name: Upload installer artifacts
        if: steps.inspect.outputs.state != 'published'
        uses: actions/upload-artifact@v4
        with:
          name: cyn-windows-${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.version.outputs.installer }}
            dist/${{ steps.version.outputs.installer }}.sha256
            dist/Cyn-Windows-x64.zip
          if-no-files-found: error

      - name: Create draft release if missing
        if: steps.inspect.outputs.state == 'missing'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CYN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Cyn $env:CYN_VERSION" --notes-file "RELEASE_NOTES_$env:CYN_VERSION.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create draft release.' }

      - name: Publish installer to GitHub Releases
        if: steps.inspect.outputs.state != 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CYN_INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          $assets = @("dist/$env:CYN_INSTALLER", "dist/$env:CYN_INSTALLER.sha256", 'dist/Cyn-Windows-x64.zip')
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release asset upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }

      - name: Make already-published updates visible to Cyn auto-updater
        if: steps.inspect.outputs.state == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not mark published release as stable' }
