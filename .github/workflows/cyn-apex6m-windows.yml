name: CYN APEX-6M Full Model Windows Release

on:
  pull_request:
    paths:
      - 'apex_engine/**'
      - '.github/workflows/cyn-apex6m-windows.yml'
  push:
    branches: [main]
    paths:
      - 'apex_engine/**'
      - '.github/workflows/cyn-apex6m-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apex:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apex_engine/requirements-win.txt
      - name: Install PyTorch CPU and inference build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r apex_engine/requirements-win.txt
      - name: Export existing 6,307,477 checkpoint parameters (ZERO training)
        shell: pwsh
        run: python apex_engine/export_onnx.py dist-apex/apex6m-225.onnx
      - name: Verify real audio reconstruction and dry bypass
        shell: pwsh
        run: python apex_engine/test_audio.py
      - name: Verify full checkpoint ONNX WAV inference
        shell: pwsh
        run: python apex_engine/test_real_model.py
      - name: Package independent Windows executable with all APEX weights
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name 'CYN-APEX-6M' --paths apex_engine --add-data 'dist-apex/apex6m-225.onnx;.' apex_engine/app.py
          if (!(Test-Path 'dist/CYN-APEX-6M.exe')) { throw 'Full neural executable missing' }
          Compress-Archive -Path 'dist/CYN-APEX-6M.exe','dist-apex/apex6m-manifest.json' -DestinationPath 'dist/CYN-APEX-6M-Windows-x64.zip' -Force
          Get-FileHash 'dist/CYN-APEX-6M.exe' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: CYN-APEX-6M-Windows-x64
          path: |
            dist/CYN-APEX-6M.exe
            dist/CYN-APEX-6M-Windows-x64.zip
            dist-apex/apex6m-manifest.json
          retention-days: 15
      - name: Publish APEX standalone test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create apex-6m-v1.0.0 'dist/CYN-APEX-6M.exe' 'dist/CYN-APEX-6M-Windows-x64.zip' 'dist-apex/apex6m-manifest.json' --title 'APEX 6M v1.0.0 — Full Neural Preview' --notes-file apex_engine/RELEASE_NOTES.md --target '${{ github.sha }}' --prerelease
