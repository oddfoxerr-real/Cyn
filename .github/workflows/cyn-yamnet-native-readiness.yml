name: Cyn YAMNet ONNX Native Readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cyn-yamnet-native-readiness.yml
      - experiments/yamnet/convert_and_verify.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    name: Convert official YAMNet and compare numeric inference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            tensorflow-cpu==2.15.1 tensorflow-hub==0.16.1 \
            tf-keras==2.15.1 scipy==1.15.3 numpy==1.26.4 \
            tf2onnx==1.16.1 onnx==1.16.2 onnxruntime==1.19.2
      - name: Convert exact pretrained model and validate output parity
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          python -u experiments/yamnet/convert_and_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: yamnet-verified-onnx-cpu
          path: |
            yamnet-native-output/yamnet-16k-0p975s.onnx
            yamnet-native-output/conversion-evaluation.json
          if-no-files-found: error
          retention-days: 20

  windows-compat:
    name: Confirm ONNX model runs on Windows x64
    needs: export-and-verify
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: yamnet-verified-onnx-cpu
          path: yamnet-native-output
      - name: Install Windows native ONNX Runtime CPU
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 onnxruntime==1.19.2
      - name: Validate Windows inference on fixed mono input
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          path=Path('yamnet-native-output/yamnet-16k-0p975s.onnx')
          doc=json.loads(Path('yamnet-native-output/conversion-evaluation.json').read_text())
          opts=ort.SessionOptions(); opts.intra_op_num_threads=2
          session=ort.InferenceSession(str(path), opts, providers=['CPUExecutionProvider'])
          assert len(session.get_inputs())==1
          outputs=session.run(None, {session.get_inputs()[0].name: np.zeros(15600,dtype=np.float32)})
          assert len(outputs)==2
          assert set(tuple(a.shape) for a in outputs)=={(1,521),(1,1024)}
          assert all(np.isfinite(x).all() for x in outputs)
          assert doc['scores']==521 and doc['embedding_dimensions']==1024
          print('PASS: official YAMNet converted model executes on Windows CPU')
          '@ | python -
