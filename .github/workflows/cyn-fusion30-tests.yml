name: CYN 30-AI Fusion Research Checks

on:
  pull_request:
    paths:
      - "experiments/fusion30/**"
      - ".github/workflows/cyn-fusion30-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-contract:
    name: Catalog and mocked fusion contract (no pretrained models)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test experiments/fusion30/test_fusion.mjs
