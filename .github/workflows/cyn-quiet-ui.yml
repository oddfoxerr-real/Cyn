name: CYN Quiet UI validation

on:
  push:
    branches: [main]
    paths:
      - "riff-cyn/renderer/index.html"
      - "riff-cyn/renderer/renderer.js"
      - "riff-cyn/renderer/minimal.css"
      - "riff-cyn/tests/quiet-ui.test.cjs"
      - ".github/workflows/cyn-quiet-ui.yml"
  pull_request:
    paths:
      - "riff-cyn/renderer/**"
      - "riff-cyn/tests/**"
      - ".github/workflows/cyn-quiet-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-quiet-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify renderer JavaScript syntax
        run: |
          node --check riff-cyn/renderer/renderer.js
          node --check riff-cyn/renderer/rail-drawer.js
          node --check riff-cyn/renderer/settings.js
          node --check riff-cyn/renderer/updates.js
      - name: Test minimal layout and live DSP controls
        run: node --test riff-cyn/tests/quiet-ui.test.cjs
      - name: Run native-bridge regression tests
        run: node --test riff-cyn/tests/*.test.cjs
