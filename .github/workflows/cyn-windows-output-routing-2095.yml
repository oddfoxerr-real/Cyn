name: CYN Windows Native Output Routing 2.0.95

on:
  push:
    branches:
      - fix/windows-native-output-routing-v2095-20261028
    paths:
      - fxsound/**
      - riff-cyn/**
      - Installer/Cyn/**
      - scripts/**
      - RELEASE_NOTES_2.0.95.md
      - .github/workflows/cyn-windows-output-routing-2095.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyn-output-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-output-route:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native device command and route assertions
        shell: pwsh
        run: |
          node --test riff-cyn/tests/bridge.test.cjs riff-cyn/tests/stable-devices.test.cjs riff-cyn/tests/native-fx-engine.test.cjs riff-cyn/tests/original-fxsound-routing.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native endpoint routing tests failed' }
          node scripts/test_version_controls.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Executable/installer version mismatch' }
          node scripts/test_cyn_combined_desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Riff native integration regression' }
          node scripts/test_riff_direct_fx_host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Headless FxSound host regression' }
          node scripts/test_cyn_material_launch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Riff startup regression' }
      - name: Compile CYN FxSound original x64 DSP and native CLI parser
        shell: pwsh
        run: |
          .\BUILD_CYN.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native FxSound build failed' }
          if (!(Test-Path 'dist/Cyn/Cyn.exe')) { throw 'Native CYN/FxSound engine missing' }
          $engine=(Get-Item 'dist/Cyn/Cyn.exe').VersionInfo.FileVersion
          if ($engine -notlike '2.0.95.*') { throw "Native version mismatch: $engine" }
      - name: Upload native build for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: CYN-2.0.95-native-route-verification
          path: |
            dist/Cyn/Cyn.exe
            build-logs/cyn-release.binlog
          retention-days: 5
          if-no-files-found: warn
