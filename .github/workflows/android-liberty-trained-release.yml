name: CYN Studio Android 0.2.36 Unified Search signed release
on:
  push:
    branches: ['codex/android', 'feature/android-sound-studio', 'release/android-one-search-v0.2.36-20261026']
    paths: ['android/**', '!android/**/*.md', '.github/workflows/android-liberty-trained-release.yml']
  pull_request:
    branches: ['codex/android']
    paths: ['android/**', '.github/workflows/android-liberty-trained-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cyn-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools and model test runtime
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          pip install numpy==2.2.6 onnxruntime==1.23.2
          python android/scripts/prepare_models.py
      - name: Fetch immutable trained LIBERTY candidate from successful online training
        uses: actions/download-artifact@v4
        with:
          name: LIBERTY-open-audio-kick-training
          run-id: 40233691628
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/liberty-trained
      - name: Validate LIBERTY training evidence and exact ONNX hash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          root=Path("${{ runner.temp }}/liberty-trained")
          model=root/"liberty-kick-candidate.onnx"
          report=json.loads((root/"evaluation.json").read_text())
          expected="dae1f140959f3cbc444b3323b394dc3fd7037170c36023f42e17f778804fb52b"
          assert model.is_file() and hashlib.sha256(model.read_bytes()).hexdigest()==expected
          assert report["onnx_sha256"]==expected
          assert report["training_epochs_completed"]==90 and report["trained_weights"]==5185
          assert report["candidate_beats_baseline_f1"] is True
          assert report["dataset_files_used"]=={"train":348,"validation":50,"test":55}
          assert report["trained_test"]["f1"]>.75 and report["trained_test"]["f1"]>report["baseline_test"]["f1"]+.2
          session=ort.InferenceSession(str(model),providers=["CPUExecutionProvider"])
          assert [x.name for x in session.get_inputs()]==["audio_window"]
          assert [x.name for x in session.get_outputs()]==["kick_probability"]
          result=session.run(None,{"audio_window":np.zeros((1,160),dtype=np.float32)})[0]
          assert result.shape==(1,1) and np.isfinite(result).all()
          target=Path("android/app/src/main/assets/models/liberty-kick-candidate.onnx")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(model.read_bytes())
          print("PASS: real trained LIBERTY ONNX matches hash; 90 epochs; beats held-out onset baseline")
          PY
      - name: Verify removed screen-sharing entrypoint
        run: |
          set -euo pipefail
          ! grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'mediaProjection' android/app/src/main/AndroidManifest.xml
          ! grep -q 'createScreenCaptureIntent' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          ! grep -q 'AudioService.CAPTURE' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -q 'Graphite' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -q "versionName '0.2.36-preview'" android/app/build.gradle
      - name: Real DSP, learning and ONNX verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyn-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" android/tests/native/engine_test.cpp -o /tmp/cyn-tests/engine
          /tmp/cyn-tests/engine
          javac -d /tmp/cyn-tests android/app/src/main/java/io/github/oddfoxerr/cyn/{PreferenceModel,AudioFeatures,AndroidRelease,ApexFeatures}.java android/tests/{AudioModelTest,ApexFeaturesTest}.java
          java -cp /tmp/cyn-tests io.github.oddfoxerr.cyn.AudioModelTest
          java -cp /tmp/cyn-tests io.github.oddfoxerr.cyn.ApexFeaturesTest /tmp/cyn-tests/features.bin
          python android/scripts/test_models.py /tmp/cyn-tests/features.bin
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "android/scripts/configure_release_key.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { throw ($errors | Out-String) }'
      - name: Validate app-matched routing and DSP fail-closed policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyn-session-policy
          javac -d /tmp/cyn-session-policy android/app/src/main/java/io/github/oddfoxerr/cyn/SessionEffectPolicy.java android/tests/SessionEffectPolicyTest.java
          java -cp /tmp/cyn-session-policy io.github.oddfoxerr.cyn.SessionEffectPolicyTest
      - name: Verify LIBERTY sound-safe and exclusive AI modes
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyn-liberty-tests
          javac -d /tmp/cyn-liberty-tests android/app/src/main/java/io/github/oddfoxerr/cyn/{AiSelection,ConnectedEffects}.java android/tests/{AiSelectionTest,ConnectedEffectsTest}.java
          java -cp /tmp/cyn-liberty-tests io.github.oddfoxerr.cyn.AiSelectionTest
          java -cp /tmp/cyn-liberty-tests io.github.oddfoxerr.cyn.ConnectedEffectsTest
      - name: Verify Library and LIBERTY UI entrypoints
        run: |
          set -euo pipefail
          grep -Fq 'Download eligible favorites' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'new String[]{"All songs","Favorites","Downloads"}' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'downloadTrack(track)' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'confirmRemoveFromLibrary(track)' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'ProviderBrowserActivity.class' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'startActivityForResult(launch,72)' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'void submitSearch()' android/app/src/main/java/io/github/oddfoxerr/cyn/ProviderBrowserActivity.java
          grep -Fq 'void saveCurrent()' android/app/src/main/java/io/github/oddfoxerr/cyn/ProviderBrowserActivity.java
          grep -Fq 'UnifiedMusicSearch.combine' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq '# CYN Studio Android v0.2.36-preview — One music search' android/RELEASE_NOTES.md
          grep -Fq 'Search music' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'Audius · found' android/app/src/main/java/io/github/oddfoxerr/cyn/UnifiedMusicSearch.java
          ! grep -Fq 'buildPublicMusic()' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'LinkedMusic.isExactItem(current)' android/app/src/main/java/io/github/oddfoxerr/cyn/ProviderBrowserActivity.java
          grep -Fq 'ProviderBrowserActivity' android/app/src/main/AndroidManifest.xml
          grep -Fq 'void processShareIntent(Intent incoming)' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'LinkedMusic.isLinked(uri)' android/app/src/main/java/io/github/oddfoxerr/cyn/AudioLibrary.java
          grep -Fq 'track!=null&&isAudiusStream(track.uri)&&track.offlineUri==null' android/app/src/main/java/io/github/oddfoxerr/cyn/LikedDownloads.java
          grep -Fq 'Creative Lab' android/app/src/main/java/io/github/oddfoxerr/cyn/MainActivity.java
          grep -Fq 'AiSelection.LIBERTY' android/app/src/main/java/io/github/oddfoxerr/cyn/AudioService.java
          grep -Fq 'usesCreativeDsp(aiProfile)' android/app/src/main/java/io/github/oddfoxerr/cyn/AudioService.java
      - name: Validate trained LIBERTY bass guard remains off by default and never generates sound
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyn-kick-guard
          javac -d /tmp/cyn-kick-guard android/app/src/main/java/io/github/oddfoxerr/cyn/LibertyKickGuard.java android/tests/LibertyKickGuardTest.java
          java -cp /tmp/cyn-kick-guard io.github.oddfoxerr.cyn.LibertyKickGuardTest
          grep -Fq 'prefs.getBoolean("liberty_kick_guard",false)' android/app/src/main/java/io/github/oddfoxerr/cyn/AudioService.java
          grep -Fq 'playing&&desktopAi.active' android/app/src/main/java/io/github/oddfoxerr/cyn/AudioService.java
          grep -Fq 'libertyKickSession=open(' android/app/src/main/java/io/github/oddfoxerr/cyn/DesktopAi.java
      - name: Build and lint
        run: bash android/gradlew -p android :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable accelerated Android testing
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android playback, neural models and screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            bash android/gradlew -p android :app:connectedDebugAndroidTest
      - name: Preserve device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cyn-Android-device-checks
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
      - name: Stage corresponding source and unsigned build
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/Cyn-Studio-Android-0.2.36-preview-unsigned.apk
          git archive --format=zip --output=dist/android/Cyn-Studio-Android-0.2.36-Source.zip HEAD android
      - uses: actions/upload-artifact@v4
        with:
          name: Cyn-Studio-Android-0.2.36-validated-build
          path: |
            dist/android/
            android/app/build/reports/lint-results-debug.*
          retention-days: 30
      - name: Verify Studio signing key and sign release
        if: github.ref == 'refs/heads/release/android-one-search-v0.2.36-20261026'
        env:
          KEYSTORE_BASE64: ${{ secrets.CYN_STUDIO_ANDROID_KEYSTORE_BASE64 }}
          CYN_KEY_PASSWORD: ${{ secrets.CYN_STUDIO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CYN_KEY_PASSWORD" ]; then
            echo '::error::Build verified; installable publishing is blocked. Configure the registered CYN Studio key in CYN_STUDIO_ANDROID_KEYSTORE_BASE64 and CYN_STUDIO_ANDROID_KEY_PASSWORD. Restore the protected Studio signing backup; never replace this release key.'
            exit 1
          fi
          keyfile="$RUNNER_TEMP/cyn-studio.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias cyn-studio --ks-pass env:CYN_KEY_PASSWORD --key-pass env:CYN_KEY_PASSWORD --out dist/android/Cyn-Studio-Android-0.2.36-preview.apk dist/android/Cyn-Studio-Android-0.2.36-preview-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/android/Cyn-Studio-Android-0.2.36-preview.apk > "$RUNNER_TEMP/cyn-cert.txt"
          grep -F 'certificate SHA-256 digest: 045d9c122b2158d569c0ef8d10bbb08496a9f19e7397b702e99e9330c780bcb7' "$RUNNER_TEMP/cyn-cert.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/android/Cyn-Studio-Android-0.2.36-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/android/Cyn-Studio-Android-0.2.36-preview.apk > "$RUNNER_TEMP/cyn-package.txt"
          grep -F "package: name='io.github.oddfoxerr.cyn.studio' versionCode='40' versionName='0.2.36-preview'" "$RUNNER_TEMP/cyn-package.txt"
          cd dist/android
          sha256sum Cyn-Studio-Android-0.2.36-preview.apk > Cyn-Studio-Android-0.2.36-preview.apk.sha256
      - name: Verify CYN Studio in-place update from signed 0.2.35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signed=dist/android/Cyn-Studio-Android-0.2.36-preview.apk
          previous="$RUNNER_TEMP/Cyn-Studio-Android-0.2.35-preview.apk"
          gh release download android-studio-v0.2.35-preview --pattern Cyn-Studio-Android-0.2.35-preview.apk --output "$previous"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$signer" verify --verbose --print-certs "$previous"
          "$signer" verify --verbose --print-certs "$signed"
          old_cert=$("$signer" verify --print-certs "$previous" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          new_cert=$("$signer" verify --print-certs "$signed" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          old_info=$("$aapt" dump badging "$previous" | grep '^package:')
          new_info=$("$aapt" dump badging "$signed" | grep '^package:')
          echo "$old_info" | grep -F "name='io.github.oddfoxerr.cyn.studio' versionCode='39' versionName='0.2.35-preview'"
          echo "$new_info" | grep -F "name='io.github.oddfoxerr.cyn.studio' versionCode='40' versionName='0.2.36-preview'"
          python - "$old_info" "$new_info" <<'PY'
          import re, sys
          old, new = sys.argv[1:]
          get = lambda value: int(re.search(r"versionCode='(\d+)'", value).group(1))
          assert get(new) > get(old)
          print("PASS: signed CYN Studio Android 0.2.35 to 0.2.36 upgrade identity")
          PY
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("dist/android/Cyn-Studio-Android-0.2.36-preview.apk") as apk:
              models = Path("android/app/src/main/assets/models")
              for item in models.iterdir():
                  if item.is_file():
                      assert apk.read("assets/models/" + item.name) == item.read_bytes(), item.name
              for arch in ("arm64-v8a", "x86_64"):
                  assert any(entry.startswith("lib/" + arch + "/") and entry.endswith(".so")
                             for entry in apk.namelist()), arch
          print("PASS: CYN signed APK includes exact model assets and native engines")
          PY
      - name: Publish verified Android preview
        if: github.ref == 'refs/heads/release/android-one-search-v0.2.36-20261026'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-studio-v0.2.36-preview
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title 'CYN Studio Android 0.2.36 preview' --notes-file android/RELEASE_NOTES.md --draft --prerelease
          gh release upload "$tag" dist/android/Cyn-Studio-Android-0.2.36-preview.apk dist/android/Cyn-Studio-Android-0.2.36-preview.apk.sha256 dist/android/Cyn-Studio-Android-0.2.36-Source.zip
          gh release edit "$tag" --draft=false --prerelease --latest=false
