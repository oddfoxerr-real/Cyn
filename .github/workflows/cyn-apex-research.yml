name: CYN APEX-6M Research

on:
  pull_request:
    paths:
      - "experiments/cyn-apex/**"
      - ".github/workflows/cyn-apex-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-train-infer:
    name: CPU model tests and short genuine optimization
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/cyn-apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only Torch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: python -m pip install "numpy>=1.26,<3.0" "soundfile>=0.12,<1.0"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Real PyTorch gradient optimization (synthetic waveforms)
        run: python -m apex.train --steps 15 --batch-size 2 --test-examples 8 --threads 2 --output reports/ci
      - name: Benchmark small synthetic holdout
        run: python -m apex.benchmark --checkpoint reports/ci/apex6m-225.pt --trials 8 --output reports/ci/benchmark.json
      - name: Upload smoke report and trained weights
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyn-apex-6m-cpu-smoke
          path: experiments/cyn-apex/reports/ci/
          retention-days: 7
          if-no-files-found: warn
