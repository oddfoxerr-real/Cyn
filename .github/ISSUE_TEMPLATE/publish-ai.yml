name: "Publish a Cyn AI model"
description: "Submit trained Cyn profiles or full neural models for AI Hub review and sharing"
title: "[AI Hub model] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Publish an exported `.cynai.json` **or your own larger trained model** (e.g. `.onnx`, `.pt`, model ZIP). Provide a public model download and describe what runtime it needs. Compatible `.cynai.json` profiles can be activated; larger models may be listed with a manual download until Cyn supports their inference engine.

        **Never attach `%APPDATA%\Cyn\preferences.json`, your private examples, raw audio, personal logs, or account tokens.**
  - type: input
    id: profile_name
    attributes:
      label: Profile name
      placeholder: Warm evenings
    validations:
      required: true
  - type: input
    id: profile_link
    attributes:
      label: Public model download URL
      description: Link to your released model file or archive. It can be a standard Cyn profile or a full trained neural model.
      placeholder: https://gist.github.com/...
    validations:
      required: true
  - type: dropdown
    id: model_format
    attributes:
      label: AI model format
      options:
        - "Cyn .cynai.json (activatable profile)"
        - "Full neural model (ONNX / PyTorch / weights / ZIP)"
        - "Other compatible or experimental format"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [music, gaming, voice, balanced]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What makes this model special?
      description: Describe intended sound, training data, actual functions, license, runtime dependencies, and whether this model runs in Cyn or needs a standalone application.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Sharing permissions and privacy
      options:
        - label: I created this model or have permission to redistribute its code and weights under the license I identify in my description.
          required: true
        - label: My shared files contain no private audio, personal training examples, account tokens, or credentials.
          required: true
        - label: I understand submissions may be reviewed before appearing in the public catalogue.
          required: true
  - type: markdown
    attributes:
      value: |
        **Publishing is not automatic activation.** Every shared model can be reviewed and credited. Standard `.cynai.json` profiles use Cyn's compatible importer; external checkpoints need an appropriate inference runtime before they can affect live audio. AI Hub browsing will not auto-download or run untrusted executables.
